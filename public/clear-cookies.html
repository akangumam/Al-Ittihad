<!doctype html>
<html>
  <head>
    <title>Clear Cookies & Session - Al Ittihad</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        min-height: 100vh;
      }
      h1 {
        color: #00d4ff;
      }
      button {
        background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px 5px;
        transition: transform 0.2s;
      }
      button:hover {
        transform: scale(1.05);
      }
      .success {
        color: #00ff88;
        margin-top: 20px;
      }
      .info {
        color: #ffdd00;
        background: rgba(255, 221, 0, 0.1);
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
      }
      pre {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>🧹 Clear Auth Cookies</h1>
    <p>Klik tombol di bawah untuk menghapus semua cookies dan session data:</p>

    <button onclick="clearAll()">🗑️ Clear All Cookies & Storage</button>
    <button onclick="location.href='/'">🔄 Go to Homepage</button>

    <div id="result"></div>
    <div id="cookies"></div>

    <script>
      function clearAll() {
        // Clear all cookies
        const cookies = document.cookie.split(';')
        let clearedCookies = []

        for (let c of cookies) {
          const eqPos = c.indexOf('=')
          const name = eqPos > -1 ? c.substr(0, eqPos).trim() : c.trim()
          if (name) {
            document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'
            clearedCookies.push(name)
          }
        }

        // Clear localStorage
        localStorage.clear()

        // Clear sessionStorage
        sessionStorage.clear()

        document.getElementById('result').innerHTML = `
                <div class="success">
                    <h2>✅ Berhasil!</h2>
                    <p>Cookies yang dihapus: ${clearedCookies.length > 0 ? clearedCookies.join(', ') : 'tidak ada'}</p>
                    <p>LocalStorage: cleared</p>
                    <p>SessionStorage: cleared</p>
                    <p><strong>Silakan klik "Go to Homepage" atau refresh halaman utama.</strong></p>
                </div>
            `

        showCookies()
      }

      function showCookies() {
        const cookies = document.cookie
        document.getElementById('cookies').innerHTML = `
                <div class="info">
                    <h3>Current Cookies:</h3>
                    <pre>${cookies || '(kosong - tidak ada cookies)'}</pre>
                </div>
            `
      }

      // Show current cookies on load
      showCookies()
    </script>
  </body>
</html>
