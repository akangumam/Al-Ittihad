<!DOCTYPE html>
<html>
<head>
    <title>Clear LocalStorage - Al Ittihad</title>
</head>
<body>
    <h1>Clear LocalStorage</h1>
    <button onclick="clearData()">Clear app_data</button>
    <div id="result"></div>
    
    <script>
        function clearData() {
            localStorage.removeItem('app_data');
            document.getElementById('result').innerHTML = '<p style="color: green;">✅ localStorage cleared! Please refresh your application.</p>';
        }
        
        // Show current data
        const data = localStorage.getItem('app_data');
        if (data) {
            const parsed = JSON.parse(data);
            document.getElementById('result').innerHTML = '<pre>Current data keys: ' + Object.keys(parsed).join(', ') + '</pre>';
            document.getElementById('result').innerHTML += '<pre>Students count: ' + (parsed.students?.length || 0) + '</pre>';
        } else {
            document.getElementById('result').innerHTML = '<p>No data in localStorage</p>';
        }
    </script>
</body>
</html>
