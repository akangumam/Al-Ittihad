version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: al-ittihad-db
    restart: always
    environment:
      POSTGRES_USER: al_ittihad_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: al_ittihad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_ittihad_user -d al_ittihad"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: al-ittihad-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://al_ittihad_user:secure_password_change_me@postgres:5432/al_ittihad?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-here-min-32-characters-long
      - NEXTAUTH_BASEPATH=/api/auth
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
    driver: local
