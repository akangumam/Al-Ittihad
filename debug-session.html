<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Session & Role</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      .container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      h1 {
        color: #333;
        margin-bottom: 30px;
        border-bottom: 3px solid #667eea;
        padding-bottom: 10px;
      }
      .info-box {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 20px;
        margin: 20px 0;
        border-radius: 4px;
      }
      .info-box h3 {
        margin-top: 0;
        color: #667eea;
      }
      .code {
        background: #1e1e1e;
        color: #dcdcdc;
        padding: 15px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        overflow-x: auto;
        margin: 10px 0;
      }
      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        margin: 10px 5px;
        transition: all 0.3s;
      }
      button:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      .success {
        color: #28a745;
        font-weight: bold;
      }
      .error {
        color: #dc3545;
        font-weight: bold;
      }
      .warning {
        color: #ffc107;
        font-weight: bold;
      }
      .status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 10px;
      }
      .status.logged-in {
        background: #d4edda;
        color: #155724;
      }
      .status.logged-out {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 Debug Session & User Role</h1>

      <div class="info-box">
        <h3>Session Status</h3>
        <div id="sessionStatus">Loading...</div>
      </div>

      <div class="info-box">
        <h3>User Information</h3>
        <div id="userInfo">Loading...</div>
      </div>

      <div class="info-box">
        <h3>Menu Access Rights</h3>
        <div id="menuAccess">Loading...</div>
      </div>

      <div class="info-box">
        <h3>Raw Session Data</h3>
        <div class="code" id="rawSession">Loading...</div>
      </div>

      <div style="margin-top: 30px">
        <button onclick="refreshSession()">🔄 Refresh Session</button>
        <button onclick="window.location.href='/api/auth/signin'">🔐 Login</button>
        <button onclick="window.location.href='/api/auth/signout'">🚪 Logout</button>
      </div>
    </div>

    <script>
      async function checkSession() {
        try {
          const response = await fetch('/api/auth/session')
          const session = await response.json()

          console.log('Session Data:', session)

          // Display session status
          const statusDiv = document.getElementById('sessionStatus')
          if (session && session.user) {
            statusDiv.innerHTML = `
                        <p class="success">✅ Logged In <span class="status logged-in">ACTIVE</span></p>
                    `
          } else {
            statusDiv.innerHTML = `
                        <p class="error">❌ Not Logged In <span class="status logged-out">INACTIVE</span></p>
                    `
          }

          // Display user info
          const userDiv = document.getElementById('userInfo')
          if (session && session.user) {
            const role = session.user.role || 'No role defined'
            const roleClass = session.user.role ? 'success' : 'warning'

            userDiv.innerHTML = `
                        <p><strong>Name:</strong> ${session.user.name || 'N/A'}</p>
                        <p><strong>Email:</strong> ${session.user.email || 'N/A'}</p>
                        <p><strong>Role:</strong> <span class="${roleClass}">${role}</span></p>
                        <p><strong>ID:</strong> ${session.user.id || 'N/A'}</p>
                    `
          } else {
            userDiv.innerHTML = '<p class="warning">⚠️ No user data available</p>'
          }

          // Display menu access
          const menuDiv = document.getElementById('menuAccess')
          if (session && session.user) {
            const role = session.user.role || 'subscriber'
            let accessInfo = ''

            switch (role) {
              case 'admin':
                accessInfo = `
                                <p class="success">✅ <strong>Admin Access</strong> - Full access to all menus</p>
                                <ul>
                                    <li>✅ Dashboard</li>
                                    <li>✅ Akademik</li>
                                    <li>✅ Keuangan</li>
                                    <li>✅ Laporan</li>
                                    <li>✅ <strong>Pengguna & Hak Akses</strong></li>
                                    <li>✅ <strong>Pengaturan Sistem</strong></li>
                                </ul>
                            `
                break
              case 'staff':
              case 'manager':
                accessInfo = `
                                <p class="success">✅ <strong>${role.charAt(0).toUpperCase() + role.slice(1)} Access</strong></p>
                                <ul>
                                    <li>✅ Dashboard</li>
                                    <li>✅ Akademik</li>
                                    <li>✅ Keuangan</li>
                                    <li>✅ Laporan</li>
                                    <li>✅ <strong>Pengguna & Hak Akses</strong></li>
                                    <li>❌ <strong>Pengaturan Sistem</strong> (Admin Only)</li>
                                </ul>
                            `
                break
              default:
                accessInfo = `
                                <p class="warning">⚠️ <strong>Limited Access</strong> (${role})</p>
                                <ul>
                                    <li>✅ Dashboard (limited)</li>
                                    <li>❌ <strong>Pengguna & Hak Akses</strong></li>
                                    <li>❌ <strong>Pengaturan Sistem</strong></li>
                                </ul>
                            `
            }

            menuDiv.innerHTML = accessInfo
          } else {
            menuDiv.innerHTML = '<p class="error">❌ Please login to see access rights</p>'
          }

          // Display raw session
          document.getElementById('rawSession').textContent = JSON.stringify(session, null, 2)
        } catch (error) {
          console.error('Error fetching session:', error)
          document.getElementById('sessionStatus').innerHTML = '<p class="error">Error loading session</p>'
          document.getElementById('userInfo').innerHTML = '<p class="error">Error loading user info</p>'
          document.getElementById('menuAccess').innerHTML = '<p class="error">Error loading menu access</p>'
          document.getElementById('rawSession').textContent = 'Error: ' + error.message
        }
      }

      function refreshSession() {
        location.reload()
      }

      // Auto-load on page load
      checkSession()
    </script>
  </body>
</html>
