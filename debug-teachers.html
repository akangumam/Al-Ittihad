<!doctype html>
<html>
  <head>
    <title>Debug Teachers Data</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #1e1e1e;
        color: #fff;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      .success {
        background: #4caf50;
        color: white;
        border: none;
      }
      .danger {
        background: #f44336;
        color: white;
        border: none;
      }
      .info {
        background: #2196f3;
        color: white;
        border: none;
      }
      pre {
        background: #2d2d2d;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
        max-height: 500px;
      }
      h2 {
        color: #4fc3f7;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
      }
      .status.success {
        background: #1b5e20;
      }
      .status.error {
        background: #b71c1c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 Debug Data Guru</h1>

      <div id="status" class="status" style="display: none"></div>

      <button class="info" onclick="checkData()">📊 Cek Data Saat Ini</button>
      <button class="danger" onclick="resetData()">🔄 Reset Data ke Initial</button>
      <button class="success" onclick="addSampleTeacher()">➕ Tambah Sample Guru</button>

      <div id="output"></div>
    </div>

    <script>
      function showStatus(message, type = 'success') {
        const status = document.getElementById('status')
        status.textContent = message
        status.className = `status ${type}`
        status.style.display = 'block'
        setTimeout(() => (status.style.display = 'none'), 3000)
      }

      function checkData() {
        const output = document.getElementById('output')
        const savedData = localStorage.getItem('app_data')

        if (!savedData) {
          output.innerHTML =
            '<h2>❌ Tidak ada data di localStorage</h2><p>Klik "Reset Data" untuk load data initial</p>'
          return
        }

        try {
          const data = JSON.parse(savedData)
          const teachers = data.teachers || []

          output.innerHTML = `
                    <h2>✅ Data Ditemukan</h2>
                    <p><strong>Jumlah Guru:</strong> ${teachers.length}</p>
                    <h3>Daftar Guru:</h3>
                    <pre>${JSON.stringify(teachers, null, 2)}</pre>
                `

          showStatus(`Ditemukan ${teachers.length} guru`, 'success')
        } catch (error) {
          output.innerHTML = `<h2>❌ Error parsing data</h2><pre>${error.message}</pre>`
          showStatus('Error parsing data', 'error')
        }
      }

      function resetData() {
        if (!confirm('Reset semua data ke data awal? Semua perubahan akan hilang!')) {
          return
        }

        localStorage.removeItem('app_data')
        showStatus('Data dihapus! Refresh halaman aplikasi untuk reload data initial', 'success')

        const output = document.getElementById('output')
        output.innerHTML = `
                <h2>✅ Data Dihapus</h2>
                <p>Silakan <strong>refresh halaman aplikasi utama</strong> untuk memuat ulang data initial.</p>
                <p>Data initial akan berisi 6 guru:</p>
                <ol>
                    <li>Dr. Ahmad Hidayat, S.Pd., M.Pd - Matematika</li>
                    <li>Siti Aminah, S.Pd - Bahasa Indonesia</li>
                    <li>Muhammad Rizki, S.Si - IPA</li>
                    <li>Dewi Lestari, S.Pd., M.Pd - Bahasa Inggris</li>
                    <li>Budi Santoso, S.Pd - Pendidikan Agama Islam</li>
                    <li>Nur Hasanah, S.Pd - IPS</li>
                </ol>
            `
      }

      function addSampleTeacher() {
        const savedData = localStorage.getItem('app_data')

        if (!savedData) {
          alert('Tidak ada data! Klik "Reset Data" terlebih dahulu.')
          return
        }

        try {
          const data = JSON.parse(savedData)
          data.teachers = data.teachers || []

          const newTeacher = {
            id: `TCH-${Date.now()}`,
            nip: '199999999999999999',
            nuptk: '9999999999999999',
            name: 'Test Guru Baru',
            subject: 'Testing',
            position: 'Guru Mata Pelajaran',
            gender: 'L',
            birthPlace: 'Jakarta',
            birthDate: '1990-01-01',
            phone: '08123456789',
            email: 'test@alittihad.sch.id',
            address: 'Jl. Test No. 1',
            education: 'S1',
            status: 'Aktif'
          }

          data.teachers.push(newTeacher)
          localStorage.setItem('app_data', JSON.stringify(data))

          showStatus('Sample guru berhasil ditambahkan!', 'success')
          checkData()
        } catch (error) {
          showStatus('Error menambahkan guru: ' + error.message, 'error')
        }
      }

      // Auto check on load
      window.onload = checkData
    </script>
  </body>
</html>
